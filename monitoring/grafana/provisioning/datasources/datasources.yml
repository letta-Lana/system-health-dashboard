apiVersion: 1

# Data sources are created from this file, so nothing has to be configured by hand in the UI.
# The uids are fixed so the provisioned dashboard can refer to them.
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
