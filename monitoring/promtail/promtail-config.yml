server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        # Only containers that carry the label app=system-health (set in the app Compose files)
        filters:
          - name: label
            values: ["app=system-health"]
    relabel_configs:
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: container
      # These two labels let Grafana filter logs per environment
      - source_labels: ["__meta_docker_container_label_app"]
        target_label: app
      - source_labels: ["__meta_docker_container_label_environment"]
        target_label: environment
